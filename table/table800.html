<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>t800</title>
  <!-- 独立样式文件：table_css.css -->
  <link rel="stylesheet" href="../css/table_css.css">
</head>
<body>
  <!-- ===== 导航栏 ===== -->
  <nav id="topNav" class="top-nav">
    <div class="nav-container">
      <div class="nav-brand">
        <a href="../index.html" class="nav-logo">🏠 主页</a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="切换导航菜单">
        <span class="hamburger"></span>
        <span class="hamburger"></span>
        <span class="hamburger"></span>
      </button>
      <ul class="nav-menu" id="navMenu">
        <li><a href="../index.html" class="nav-link">软件 software</a></li>
        <li><a href="index.html" class="nav-link active">表格</a></li>
        <li><a href="#about" class="nav-link">关于</a></li>
        <li><a href="#contact" class="nav-link">联系</a></li>
      </ul>
    </div>
  </nav>

  <!-- ===== 主内容区域 ===== -->
  <div class="table-container" id="table">
    <!-- 顶部区域：SVG 图标位 + 标题并排 -->
    <div class="header-row">
      <!-- SVG 占位，通过 <object> 引入公用 SVG，变动同步 -->
      <div class="svg-placeholder">
        <object type="image/svg+xml" data="table.svg" class="header-svg" aria-label="公用 SVG 图标">
          您的浏览器不支持 SVG
        </object>
      </div>
      <h1>table 800 建筑建造</h1>
    </div>

    <!-- 筛选区域：输入框 + 重置按钮 -->
    <div class="filter-area">
      <div class="filter-wrapper">
        <input type="text" id="filterInput" placeholder="输入关键字筛选内容或分类…" aria-label="筛选表格">
        <button id="resetFilterBtn" class="reset-btn" type="button" aria-label="清空筛选">重置</button>
      </div>
    </div>

    <!-- 表格：内容与分类均为静态填写 -->
    <table id="dataTable">
      <thead>
        <tr>
          <th>内容</th>
          <th>分类</th>
        </tr>
      </thead>
      <tbody>
        <!-- 静态数据行，完全在HTML中填充，不通过JS生成 -->
	<tr><td>是否有抗震能力，即建造过程中，如果发生地震，是否可避免重大事故</td><td>建筑 要求</td></tr>
	<tr><td>预埋管道处理：污水管道，纯净水管道，通讯管道，电力管道</td><td>建筑 设计</td></tr>
      </tbody>
    </table>
    <div class="table-footer">yumsion 2026-07-13 11:51:18 </div>
  </div>
  <!-- 独立脚本文件：table_js.js -->
  <script src="../js/table_js.js"></script>
</body>
</html>
