  <!-- ===== 主内容区域 ===== -->
  <div class="table-container" id="table">
    <!-- 顶部区域：SVG 图标位 + 标题并排 -->
    <div class="header-row">
      <!-- SVG 占位，通过 <object> 引入公用 SVG，变动同步 -->
      <div class="svg-placeholder">
        <object type="image/svg+xml" data="table.svg" class="header-svg" aria-label="公用 SVG 图标">
          您的浏览器不支持 SVG
        </object>
      </div>
      <h1>table 370 bash diff</h1>
    </div>

    <!-- 筛选区域：输入框 + 重置按钮 -->
    <div class="filter-area">
      <div class="filter-wrapper">
        <input type="text" id="filterInput" placeholder="输入关键字筛选内容或分类…" aria-label="筛选表格">
        <button id="resetFilterBtn" class="reset-btn" type="button" aria-label="清空筛选">重置</button>
      </div>
    </div>

    <!-- 表格：内容与分类均为静态填写 -->
    <table id="dataTable">
      <thead>
        <tr>
          <th>内容</th>
          <th>分类</th>
        </tr>
      </thead>
      <tbody>
        <!-- 静态数据行，完全在HTML中填充，不通过JS生成 -->
    <tr><td><details><summary>diff 文件夹文件比较</summary>
diff -qr 文件夹1 文件夹2 #只看哪些文件不同（最常用）
diff -r 文件夹1 文件夹2 #查看具体内容差异,含详细行级差异
diff -rwi 文件夹1 文件夹2 #忽略空白或大小写差异
diff -r -x "*.log" 文件夹1 文件夹2 #排除特定文件
    </details></td><td>diff 文件夹相关</td></tr>
        <!-- 分割线 -->
    <tr><td><details><summary></summary>
    </details></td><td></td></tr>
        <!-- 分割线 -->
    <tr><td><details><summary></summary>
    </details></td><td></td></tr>
        <!-- 分割线 -->
    <tr><td><details><summary></summary>
    </details></td><td></td></tr>
        <!-- 分割线 -->
    <tr><td><details><summary></summary>
    </details></td><td></td></tr>
        <!-- 分割线 -->
      </tbody>
    </table>
    <div class="table-footer">yumsion 2026-07-05 11:51:18 </div>
